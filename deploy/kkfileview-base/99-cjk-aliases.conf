<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- 仿宋_GB2312 / FangSong_GB2312 映射到仿宋 -->
  <match target="pattern">
    <test name="family"><string>仿宋_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>仿宋</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>FangSong_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>FangSong</string></edit>
  </match>

  <!-- 楷体_GB2312 / KaiTi_GB2312 映射到楷体 -->
  <match target="pattern">
    <test name="family"><string>楷体_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>楷体</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>KaiTi_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>KaiTi</string></edit>
  </match>

</fontconfig>
