services:
  kkfileview:
    # 由本目录 Dockerfile 构建；docker compose up -d --build 重建并打上 image 指定的 tag
    build:
      context: .
      dockerfile: Dockerfile
    image: kkfileview-custom:5.0.2
    hostname: "fileview"
    ports:
      - 8013:8013
    environment:
      # 服务端口
      KK_SERVER_PORT: 8013
      # 请求前缀
      KK_CONTEXT_PATH: /
      # 部署环境相关值放在同目录 .env(不入库),见 .env.example;
      # 未配置时 compose 会直接报错提醒,避免带错误配置启动
      KK_BASE_URL: ${KK_BASE_URL:?请在 deploy/.env 中配置 KK_BASE_URL}
      KK_FILE_DIR: /opt/files
      # 开启文件上传
      KK_FILE_UPLOAD_DISABLE: false
      # 信任主机白名单:可在 .env 中用 KK_TRUST_HOST 覆盖(推荐收紧到具体主机)
      KK_TRUST_HOST: ${KK_TRUST_HOST:-*}
    volumes:
      - /opt/kkfileview/files:/opt/files
    privileged: true
    restart: always

